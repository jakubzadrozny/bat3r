defaults:
  - category: horse
  - _self_

model:
  _target_: bat3r.models.SequentialUnet
  resolution: ${resolution}
  in_channels: 64
  image_conditioning_stage2: false
  model_channels: 128
  detach_conditioning: true
  num_layers: 4
  channels_per_layer: 8
  model_overrides:
    num_blocks: 2
    attn_resolutions:
      - 16

module:
  _target_: bat3r.pointmaps.PointmapModule
  render_on_module: false
  soft_label: 0.01
  model: ${model}
  device: ${device}

log_dir: ???
dataset_root: ???
split: ???

confidence_threshold: 2.0
device: cuda
resolution: 160

dataset:
  _target_: bat3r.alt_dataset.RealDataset
  root: ${dataset_root} # path to base directory of dataset
  image_size: ${resolution}
  image_ext: png

dataloader:
  _target_: torch.utils.data.DataLoader
  dataset: ???
  batch_size: ${batch_size}
  num_workers: 8
  shuffle: false
