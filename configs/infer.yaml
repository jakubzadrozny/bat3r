defaults:
  - category: horse
  - _self_

model:
  _target_: bat3r.models.SequentialUnet
  resolution: ${resolution}
  in_channels: 64
  image_conditioning_stage2: false
  model_channels: 128
  detach_conditioning: true
  num_layers: 4
  channels_per_layer: 8
  model_overrides:
    num_blocks: 2
    attn_resolutions:
      - 16

mesh_fitting:
  algo: ${infer.mesh_fitting.algo}
  distance_threshold: ${infer.mesh_fitting.distance_threshold}

module:
  _target_: bat3r.pointmaps.PointmapModule
  render_on_module: true
  soft_label: 0.01
  near: ${near}
  far: ${far}
  model: ${model}
  device: ${device}

data_split_file: dist_group_data_split.npz

log_dir: ???
dataset_root: ???
split: ${infer.split}
seed: 42
max_eval_ids:
  train: 1000
  test: null

confidence_threshold: 2.0
device: cuda
resolution: 160
num_layers: 4

dataset:
  _target_: bat3r.alt_dataset.RasterizeDataset
  root: ${dataset_root} # path to base directory of dataset
  image_size: ${resolution}
  num_layers: ${num_layers}
  input_mode: "sd_dino"
  render_at_load: false
  scale_targets: false
  return_pcs: true
  apply_pose_flag: true
  pose_ext: ${infer.pose_ext}
  return_vis: ${infer.return_vis}

dataloader:
  _target_: torch.utils.data.DataLoader
  dataset: ???
  batch_size: ${batch_size}
  num_workers: 8
  shuffle: false
