defaults:
  - category: horse
  - _self_

hydra:
  output_subdir: null # disables the .hydra folder
  run:
    dir: . # sets output dir to current dir (or use null if allowed)
  job_logging:
    root:
      level: ERROR

wandb:
  enabled: false
  dir: ???
  project: ???
  tags: []

seed: 42
resolution: 160
model_channels: 128
image_channels: 64
num_layers: 4
layer_channels: 8

val_dataset_root: dualpm_dataset
dataset_root: ???

train_config:
  steps: 80000
  save_every: 10000
  val_every: 20
  log_every: 20
  gradient_clip_value: 1.0
  batch_size: 16
  gradient_accumulation_steps: 2
  use_weights: null

  start_delta: 0.1
  end_delta: 100.0
  alpha: 1.0

  # save location of weights
  save_path: ???

model:
  _target_: bat3r.models.SequentialUnet
  resolution: ${resolution}
  in_channels: ${image_channels}
  image_conditioning_stage2: false
  model_channels: ${model_channels}
  detach_conditioning: true
  num_layers: ${num_layers}
  channels_per_layer: ${layer_channels}
  model_overrides:
    num_blocks: 2
    attn_resolutions:
      - 16

module:
  _target_: bat3r.pointmaps.PointmapModule
  render_on_module: true
  soft_label: 0.01
  near: ${near}
  far: ${far}
  model: ${model}

optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0005
  betas: [0.95, 0.999]        # [beta1, beta2] - increase beta1 from 0.9
  weight_decay: 0.01
  params: ???

scheduler:
  _target_: bat3r.scheduler.build_warmup_cosine_scheduler
  warmup_steps: 1000
  total_steps: 80000
  warmup_start_factor: 0.1
  eta_min: 1e-5
  optimizer: ???

dataset:
  _target_: bat3r.alt_dataset.RasterizeDataset
  root: ${dataset_root} # path to base directory of dataset
  image_size: ${resolution}
  num_layers: ${num_layers}
  input_mode: "sd_dino"
  render_at_load: false
  scale_targets: false
  apply_pose_flag: true
  pose_ext: npy
  return_vis: false

dataloader:
  _target_: torch.utils.data.DataLoader
  dataset: ???
  batch_size: ${train_config.batch_size}
  num_workers: 6
  shuffle: true
  collate_fn:
    _target_: hydra.utils.get_method
    path: ${dataset._target_}.collate_fn

val_dataset:
  _target_: bat3r.alt_dataset.RasterizeDataset
  root: ${val_dataset_root} # path to base directory of dataset
  image_size: ${resolution}
  num_layers: ${num_layers}
  input_mode: "sd_dino"
  render_at_load: false
  scale_targets: false
  apply_pose_flag: true
  pose_ext: npy
  return_vis: false

val_loader:
  _target_: torch.utils.data.DataLoader
  dataset: ???
  batch_size: ${train_config.batch_size}
  num_workers: 2
  shuffle: true
  collate_fn:
    _target_: hydra.utils.get_method
    path: ${dataset._target_}.collate_fn
